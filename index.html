<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1a3a">
<title>Math RPG</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<main id="app">

  <header class="top">
    <div class="unit">
      <span id="subjectName"></span>
      <strong id="unitName"></strong>
    </div>
    <button type="button" class="top-btn" id="codexBtn" data-i18n="ui.codex"></button>
    <label class="lang">
      <span class="sr" data-i18n="ui.language"></span>
      <select id="langSelect">
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="en">English</option>
      </select>
    </label>
  </header>
  <div class="statusbar" id="runStatus"></div>
  <p class="coach" id="coach" aria-live="polite" hidden></p>

  <!-- 갈림길 지도 -->
  <section class="screen" id="screenMap">
    <div class="screen-head">
      <h2 data-i18n="map.title"></h2>
      <span id="mapProgress"></span>
    </div>
    <div class="map" id="mapRows"></div>
  </section>

  <!-- 전투 -->
  <section class="screen" id="screenBattle" hidden>
    <div class="foe">
      <div class="row">
        <strong id="foeName"></strong>
        <span class="chip" id="foeWeak"></span>
      </div>
      <div class="row">
        <div class="bar"><div class="fill rose" id="foeHpBar"></div></div>
        <span class="num" id="foeHpText"></span>
      </div>
      <canvas id="stage"></canvas>
      <div class="intent" id="foeIntent"></div>
    </div>

    <div class="me">
      <div class="row">
        <span class="label" data-i18n="ui.hp"></span>
        <div class="bar"><div class="fill teal" id="hpBar"></div></div>
        <span class="num" id="hpText"></span>
      </div>
      <div class="row">
        <span class="label" data-i18n="ui.ult"></span>
        <div class="pips" id="ultPips"></div>
        <span class="num" id="comboText"></span>
      </div>
    </div>

    <div class="panel">
      <div class="actions" id="actions">
        <button type="button" data-action="basic"><b data-i18n="ui.basic"></b><small data-i18n="ui.basicSub"></small></button>
        <button type="button" data-action="skill"><b data-i18n="ui.skill"></b><small data-i18n="ui.skillSub"></small></button>
        <button type="button" data-action="defend"><b data-i18n="ui.defend"></b><small id="defendSub"></small></button>
      </div>
      <button type="button" class="ult" id="ultBtn" data-action="ult" disabled></button>

      <div class="question" id="question" hidden>
        <span class="meta" id="qMeta"></span>
        <p id="qText"></p>
      </div>
      <div class="answers" id="answers" hidden></div>
      <button type="button" class="hint" id="hintBtn" hidden></button>

      <p class="notice" id="notice" aria-live="polite"></p>
    </div>
  </section>

  <!-- 상점, 휴식, 보물, 보상, 결과가 함께 쓰는 화면 -->
  <section class="screen" id="screenEvent" hidden>
    <div class="event">
      <h2 id="evTitle"></h2>
      <p id="evText"></p>
      <div id="evQuiz" hidden>
        <div class="question">
          <span class="meta" id="evQMeta"></span>
          <p id="evQText"></p>
        </div>
        <div class="answers" id="evAnswers"></div>
      </div>
      <div class="options" id="evOptions"></div>
      <button type="button" class="primary" id="evLeave" hidden></button>
    </div>
  </section>

  <!-- 도감 -->
  <section class="screen" id="screenCodex" hidden>
    <div class="event">
      <h2 data-i18n="codex.title"></h2>
      <p id="codexSummary"></p>
      <h3 data-i18n="codex.monsters"></h3>
      <div class="cards" id="codexMonsters"></div>
      <h3 data-i18n="codex.types"></h3>
      <div class="cards" id="codexTypes"></div>
      <button type="button" class="primary" id="codexClose" data-i18n="codex.close"></button>
    </div>
  </section>

</main>
<script type="module" src="./js/main.js"></script>
</body>
</html>
